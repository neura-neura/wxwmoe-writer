<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wxw.moe diario</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg?v=20260525-1" />
    <link rel="stylesheet" href="/static/app.css?v=20260812-49" />
  </head>
  <body>
    <main class="writer-shell" aria-live="polite">
      <section class="paper" aria-label="Editor de diario">
        <header class="writer-header">
          <div class="topbar">
            <div class="account" id="account">wxw.moe</div>
            <div class="toolbar" aria-label="Writing options">
            <select id="visibility" aria-label="Visibility">
              <option value="unlisted">Unlisted</option>
              <option value="public">Public</option>
              <option value="private">Followers only</option>
              <option value="direct">Direct</option>
            </select>
            <select id="titleMode" aria-label="Title mode">
              <option value="heading">Title in post</option>
              <option value="cw">Title as content warning</option>
            </select>
            <details id="settingsMenu" class="settings-menu">
              <summary class="settings-summary" aria-label="Settings">
                <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
                  <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06A2 2 0 1 1 7.03 3.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"></path>
                </svg>
                <span id="settingsLabel">Settings</span>
              </summary>
              <div class="settings-panel" role="group" aria-label="Settings">
                <div class="select-field">
                  <label id="languageLabel" for="language">Language</label>
                  <select id="language" aria-label="Language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="zh">中文</option>
                  </select>
                </div>
                <section class="settings-section appearance-settings" aria-labelledby="appearanceSettingsLabel">
                  <h2 id="appearanceSettingsLabel">Appearance</h2>
                  <div class="theme-picker" id="themePicker" role="radiogroup" aria-labelledby="themeLabel">
                    <span id="themeLabel" class="theme-picker-label">Theme</span>
                    <div class="theme-picker-track" role="presentation">
                      <span class="theme-picker-fill" aria-hidden="true"></span>
                      <button class="theme-picker-stop" type="button" data-appearance="system" role="radio" aria-label="System" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">System</span></button>
                      <button class="theme-picker-stop" type="button" data-appearance="light" role="radio" aria-label="Light" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Light</span></button>
                      <button class="theme-picker-stop" type="button" data-appearance="dark" role="radio" aria-label="Dark" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Dark</span></button>
                      <button class="theme-picker-stop" type="button" data-appearance="ink-paper-light" role="radio" aria-label="Ink Paper light" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Ink Paper light</span></button>
                      <button class="theme-picker-stop" type="button" data-appearance="ink-paper-dark" role="radio" aria-label="Ink Paper dark" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Ink Paper dark</span></button>
                    </div>
                    <span id="themePickerValue" class="theme-picker-value">Light</span>
                  </div>
                  <details class="theme-advanced">
                    <summary>Advanced</summary>
                    <div class="select-field">
                      <label id="editorThemeLabel" for="editorThemeSelect">Editor layout</label>
                      <select id="editorThemeSelect" aria-label="Editor layout">
                        <option value="paper-bloom">Paper Bloom</option>
                        <option value="note-editor">Note editor</option>
                      </select>
                    </div>
                  </details>
                </section>
                <div class="select-field keyboard-sound-field">
                  <label id="keyboardSoundLabel" for="keyboardSound">Keyboard sound</label>
                  <select id="keyboardSound" aria-label="Keyboard sound">
                    <option value="none">No sound</option>
                    <option value="alpaca">Alpaca</option>
                    <option value="ios">iOS</option>
                    <option value="logitech-g915-tkl-brown">Logitech G915 TKL Brown</option>
                  </select>
                </div>
                <div class="range-field">
                  <div class="range-label-row">
                    <label id="keyboardSoundVolumeLabel" for="keyboardSoundVolume">Sound volume</label>
                    <span id="keyboardSoundVolumeValue">25%</span>
                  </div>
                  <input id="keyboardSoundVolume" type="range" min="0" max="100" step="1" value="25" aria-label="Sound volume" />
                </div>
                <section class="settings-section layout-settings" aria-labelledby="layoutSettingsLabel">
                  <h2 id="layoutSettingsLabel">Layout</h2>
                  <label class="check-field" for="pinHeader">
                    <input id="pinHeader" type="checkbox" />
                    <span id="pinHeaderLabel">Pin header while scrolling</span>
                  </label>
                  <label class="check-field" for="pinFooter">
                    <input id="pinFooter" type="checkbox" />
                    <span id="pinFooterLabel">Pin footer while scrolling</span>
                  </label>
                  <label class="check-field" for="pinnedChrome">
                    <input id="pinnedChrome" type="checkbox" />
                    <span id="pinnedChromeLabel">Show pinned shadow and border</span>
                  </label>
                  <label class="switch-field" for="autoIndentParagraphs">
                    <input id="autoIndentParagraphs" type="checkbox" />
                    <span class="switch-control" aria-hidden="true"></span>
                    <span id="autoIndentParagraphsLabel">Auto-indent normal paragraphs</span>
                  </label>
                  <label class="switch-field" for="justifyParagraphs">
                    <input id="justifyParagraphs" type="checkbox" />
                    <span class="switch-control" aria-hidden="true"></span>
                    <span id="justifyParagraphsLabel">Justify normal paragraphs</span>
                  </label>
                </section>
                <section class="settings-section translate-settings" aria-labelledby="translationSettingsLabel">
                  <h2 id="translationSettingsLabel">Translation</h2>
                  <div class="settings-grid two-columns">
                    <div class="select-field">
                      <label id="translateSourceLabel" for="translateSource">From</label>
                      <select id="translateSource" aria-label="Translate from">
                        <option value="auto">Auto</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="zh">中文</option>
                      </select>
                    </div>
                    <div class="select-field">
                      <label id="translateTargetLabel" for="translateTarget">To</label>
                      <select id="translateTarget" aria-label="Translate to">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="zh">中文</option>
                      </select>
                    </div>
                  </div>
                  <div class="select-field">
                    <label id="translateCaseLabel" for="translateCase">Result case</label>
                    <select id="translateCase" aria-label="Result case">
                      <option value="normal">Normal</option>
                      <option value="upper">UPPERCASE</option>
                      <option value="lower">lowercase</option>
                    </select>
                  </div>
                  <label class="check-field" for="translateProtectTokens">
                    <input id="translateProtectTokens" type="checkbox" checked />
                    <span id="translateProtectTokensLabel">Protect mentions, hashtags, links, and :emoji:.</span>
                  </label>
                  <div class="shortcut-field">
                    <span id="translateShortcutLabel">Shortcut</span>
                    <button id="translateShortcutButton" class="secondary-button" type="button">Ctrl+Alt+T</button>
                  </div>
                  <button id="translateButton" class="secondary-button translate-button" type="button">
                    <span>Translate</span>
                  </button>
                </section>
              </div>
            </details>
            <button id="themeToggle" class="icon-button" type="button" title="Dark mode" aria-label="Dark mode">
              <svg class="icon-svg theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20.9 13.1A8.6 8.6 0 0 1 10.9 3.1a7.8 7.8 0 1 0 10 10Z"></path>
              </svg>
              <svg class="icon-svg theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
              </svg>
            </button>
            <a id="logout" class="icon-button" href="/logout" title="Sign out" aria-label="Sign out">
              <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path>
              </svg>
            </a>
            </div>
          </div>

          <textarea
            id="title"
            class="title-input"
            rows="1"
            maxlength="240"
            autocomplete="off"
            placeholder="Title"
            aria-label="Title"
          ></textarea>
        </header>

        <div class="body-sheet">
          <textarea
            id="body"
            class="body-input"
            spellcheck="true"
            placeholder="Start here..."
            aria-label="Body"
          ></textarea>
          <div
            id="noteBodyEditor"
            class="note-body-editor"
            contenteditable="true"
            tabindex="0"
            role="textbox"
            aria-multiline="true"
            spellcheck="true"
            data-placeholder="Start writing..."
          ></div>
        </div>

        <footer class="statusbar">
          <div class="metrics">
            <span id="saved">Local draft</span>
            <span id="count">0 / 20000</span>
            <span id="words">0 words</span>
          </div>
          <button id="publish" class="publish-button" type="button" title="Ctrl+Enter">
            <span>Publish</span>
          </button>
        </footer>

        <aside id="noteSidebar" class="note-sidebar" aria-label="Table of contents">
          <div class="note-rail" aria-label="Editor tools">
            <button id="noteToc" class="note-rail-button" type="button" aria-label="Table of contents" title="Table of contents" aria-expanded="true" aria-controls="noteTocPanel">
              <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M5 6h14M5 12h14M5 18h14"></path>
                <circle cx="3" cy="6" r=".7" fill="currentColor" stroke="none"></circle>
                <circle cx="3" cy="12" r=".7" fill="currentColor" stroke="none"></circle>
                <circle cx="3" cy="18" r=".7" fill="currentColor" stroke="none"></circle>
              </svg>
            </button>
            <button id="noteHint" class="note-rail-button" type="button" aria-label="Note tips" title="Note tips">
              <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8.5"></circle>
                <path d="M9.7 9.1a2.5 2.5 0 1 1 4.4 1.6c-.9 1-2.1 1.4-2.1 3"></path>
                <path d="M12 16.7h.01"></path>
              </svg>
            </button>
            <button id="noteGuide" class="note-rail-button" type="button" aria-label="Editor guide" title="Editor guide">
              <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
                <rect x="5" y="4" width="14" height="16" rx="1.5"></rect>
                <path d="M8 8h8M8 12h8M8 16h5"></path>
              </svg>
            </button>
          </div>
          <div class="note-sidebar-content">
            <button id="noteSidebarToggle" class="note-sidebar-toggle" type="button" aria-label="Close sidebar" title="Close sidebar">
              <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="m14 5-7 7 7 7"></path>
                <path d="m20 5-7 7 7 7"></path>
              </svg>
            </button>
            <section id="noteTocPanel" class="note-side-panel">
              <h2 id="noteTocTitle">Table of contents</h2>
              <p id="noteTocEmpty">Set a heading to show it here</p>
              <ol id="noteTocList" class="note-toc-list" hidden></ol>
            </section>
            <section id="noteHintPanel" class="note-side-panel" hidden>
              <h2 id="noteHintTitle">Note tips</h2>
              <div id="noteHintContent" class="note-side-copy"></div>
            </section>
            <section id="noteGuidePanel" class="note-side-panel" hidden>
              <h2 id="noteGuideTitle">Editor guide</h2>
              <div id="noteGuideContent" class="note-side-copy"></div>
            </section>
          </div>
        </aside>

        <header class="note-header" aria-label="Note editor header">
          <div class="note-header-actions">
            <button id="noteMore" class="note-more-button" type="button" aria-label="More" aria-expanded="false" aria-controls="noteMoreMenu">
              <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"></circle>
                <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"></circle>
                <circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"></circle>
              </svg>
            </button>
            <span id="noteSaveStatus" class="note-save-status" role="status" aria-live="polite">Local draft</span>
            <button id="notePublish" class="note-header-button" type="button"><span id="notePublishLabel">Continue to publish</span></button>
          </div>
          <div id="noteMoreMenu" class="note-more-menu" hidden>
            <div class="select-field">
              <div class="theme-picker theme-picker-note" id="noteThemePicker" role="radiogroup" aria-labelledby="noteThemeLabel">
                <span id="noteThemeLabel" class="theme-picker-label">Theme</span>
                <div class="theme-picker-track" role="presentation">
                  <span class="theme-picker-fill" aria-hidden="true"></span>
                  <button class="theme-picker-stop" type="button" data-appearance="system" role="radio" aria-label="System" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">System</span></button>
                  <button class="theme-picker-stop" type="button" data-appearance="light" role="radio" aria-label="Light" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Light</span></button>
                  <button class="theme-picker-stop" type="button" data-appearance="dark" role="radio" aria-label="Dark" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Dark</span></button>
                  <button class="theme-picker-stop" type="button" data-appearance="ink-paper-light" role="radio" aria-label="Ink Paper light" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Ink Paper light</span></button>
                  <button class="theme-picker-stop" type="button" data-appearance="ink-paper-dark" role="radio" aria-label="Ink Paper dark" aria-checked="false"><span class="theme-picker-dot"></span><span class="theme-picker-name">Ink Paper dark</span></button>
                </div>
                <span id="noteThemePickerValue" class="theme-picker-value">Light</span>
              </div>
            </div>
            <button id="noteCopyButton" class="note-menu-link" type="button">Copy all content</button>
            <button id="noteDownloadButton" class="note-menu-link" type="button">Download Markdown</button>
            <button id="noteSettingsButton" class="note-menu-link" type="button">Open settings</button>
          </div>
        </header>

        <button id="noteImage" class="note-image-button" type="button" aria-label="Add image" title="Add image">
          <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
            <rect x="5" y="5" width="14" height="14" rx="1.5"></rect>
            <circle cx="10" cy="10" r="1.5"></circle>
            <path d="m7 17 3.5-3.5 2.5 2.5 1.7-1.7L17 16.6"></path>
            <path d="M18 3v4M16 5h4"></path>
          </svg>
        </button>
        <input id="noteImageInput" type="file" accept="image/*" hidden />
        <button id="noteInsertButton" class="note-insert-button" type="button" aria-label="Insert" title="Insert">
          <svg class="note-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
        <div id="noteInsertMenu" class="note-insert-menu" hidden>
          <div id="noteInsertTitle" class="note-insert-title">Insert</div>
          <button type="button" data-insert-action="image"><span class="note-insert-symbol">▧</span><span>Cover image</span></button>
          <button type="button" data-insert-action="heading"><span class="note-insert-symbol">h2</span><span>Heading</span></button>
          <button type="button" data-insert-action="subheading"><span class="note-insert-symbol">h3</span><span>Subheading</span></button>
          <button type="button" data-insert-action="bullet"><span class="note-insert-symbol">≡</span><span>Bullet list</span></button>
          <button type="button" data-insert-action="number"><span class="note-insert-symbol">☷</span><span>Numbered list</span></button>
          <button type="button" data-insert-action="quote"><span class="note-insert-symbol">❝</span><span>Quote</span></button>
          <button type="button" data-insert-action="code"><span class="note-insert-symbol">‹›</span><span>Code</span></button>
          <button type="button" data-insert-action="highlight"><span class="note-insert-symbol">==</span><span>Highlight</span></button>
          <button type="button" data-insert-action="divider"><span class="note-insert-symbol">—</span><span>Divider</span></button>
          <button type="button" data-insert-action="toc"><span class="note-insert-symbol">☷</span><span>Table of contents</span></button>
        </div>
        <figure id="noteCover" class="note-cover" hidden>
          <img id="noteCoverImage" class="note-cover-image" alt="" />
          <button id="noteCoverRemove" class="note-cover-remove" type="button" aria-label="Remove cover image" title="Remove cover image">×</button>
        </figure>

        <aside class="note-count-rail" aria-label="Character count">
          <span id="noteCount">0 characters</span>
        </aside>

        <nav id="noteFormatBar" class="note-format-bar" aria-label="Formatting tools">
          <button class="note-format-button" type="button" data-note-action="menu" aria-label="Open menu" title="Open menu"><span>☰</span></button>
          <button class="note-format-button note-format-text" type="button" data-note-action="heading" aria-label="Heading" title="Heading"><span>Heading</span></button>
          <button class="note-format-button" type="button" data-note-action="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
          <button class="note-format-button" type="button" data-note-action="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
          <button class="note-format-button" type="button" data-note-action="highlight" aria-label="Highlight" title="Highlight"><span>==</span></button>
          <button class="note-format-button note-format-text" type="button" data-note-action="list" aria-label="List" title="List"><span>☷</span></button>
          <button class="note-format-button note-format-text" type="button" data-note-action="quote" aria-label="Quote" title="Quote"><span>❝</span></button>
          <button class="note-format-button" type="button" data-note-action="code" aria-label="Code" title="Code"><span>‹›</span></button>
          <button class="note-format-button" type="button" data-note-action="link" aria-label="Link" title="Link"><span>↗</span></button>
          <button class="note-format-button" type="button" data-note-action="undo" aria-label="Undo" title="Undo"><span>↶</span></button>
          <button class="note-format-button" type="button" data-note-action="redo" aria-label="Redo" title="Redo"><span>↷</span></button>
        </nav>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="/static/keyboardSounds.js?v=20260525-3" defer></script>
    <script src="/static/themes.js?v=20260812-23" defer></script>
    <script src="/static/app.js?v=20260812-49" defer></script>
  </body>
</html>
