<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed out - wxw.moe diary</title>
    <link rel="stylesheet" href="/static/app.css?v=20260525-8" />
  </head>
  <body>
    <main class="writer-shell logged-out-shell">
      <section class="paper logged-out-card" aria-label="Signed out">
        <h1 id="title">Signed out</h1>
        <p id="copy">The local writing session is closed. wxw.moe may still be signed in separately.</p>
        <a id="login" class="publish-button login-link" href="/login">Sign in again</a>
      </section>
    </main>
    <script>
      const copy = {
        en: ["Signed out", "The local writing session is closed. wxw.moe may still be signed in separately.", "Sign in again"],
        es: ["Sesión cerrada", "La sesión local de escritura está cerrada. wxw.moe puede seguir con sesión iniciada aparte.", "Iniciar sesión otra vez"],
        zh: ["已退出登录", "本地写作会话已关闭。wxw.moe 可能仍然保持单独登录。", "再次登录"],
      };
      let prefs = {};
      try {
        prefs = JSON.parse(localStorage.getItem("wxw-diary-preferences") || "{}");
      } catch {
        prefs = {};
      }
      const language = copy[prefs.language] ? prefs.language : "en";
      document.documentElement.lang = language;
      document.documentElement.dataset.theme = prefs.theme === "dark" ? "dark" : "light";
      document.querySelector("#title").textContent = copy[language][0];
      document.querySelector("#copy").textContent = copy[language][1];
      document.querySelector("#login").textContent = copy[language][2];
    </script>
  </body>
</html>
